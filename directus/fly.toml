# Fly.io configuration for Directus
app = "scv2-directus"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8055"
  CACHE_ENABLED = "true"
  CACHE_STORE = "redis"
  RATE_LIMITER_ENABLED = "true"
  RATE_LIMITER_POINTS = "50"
  RATE_LIMITER_DURATION = "1"

[http_service]
  internal_port = 8055
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/server/health"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
