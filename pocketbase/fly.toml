# fly.toml app configuration file generated for success-chemistry-pb on 2026-02-02T14:11:50-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'success-chemistry-pb'
primary_region = 'lax'

# Set in Admin UI > Settings > Application > Site URL: https://success-chemistry-pb.fly.dev
[env]
  PB_URL = "https://success-chemistry-pb.fly.dev"

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'pb_data'
  destination = '/pb_data'
  initial_size = '1gb'

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
